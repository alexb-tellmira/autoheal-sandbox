name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-slim
    steps:
      - name: Simulated CI
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          SECS=$(grep -oE '\[ci=[0-9]+\]' <<< "$TITLE" | grep -oE '[0-9]+' || true)
          echo "Sleeping ${SECS:-20}s"
          sleep "${SECS:-20}"
